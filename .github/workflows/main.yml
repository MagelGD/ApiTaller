name: Compilar Dev y Enviar API a Produccion (FTP)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código fuente (desde dev)
      uses: actions/checkout@v4

    - name: 2. Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 3. Restaurar dependencias
      run: dotnet restore

    - name: 4. Compilar la Solución completa
      run: dotnet build --configuration Release --no-restore

    - name: 5. Publicar el API (Generar archivos listos)
      run: dotnet publish ApiTaller.api/ApiTaller.api.csproj -c Release -o ./publish-api

    - name: 6. Despliegue DIRECTO al servidor por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish-api/
        server-dir: /api/
