name: Compilar Dev y Enviar API a Produccion MyASP

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo fuente desde Dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Mostrar estructura del repositorio
        run: |
          echo "Ruta actual:"
          pwd

          echo "Archivos en la raiz:"
          ls -la

          echo "Soluciones encontradas:"
          find . -name "*.sln"

          echo "Proyectos encontrados:"
          find . -name "*.csproj"

      - name: 3. Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 4. Restaurar dependencias
        run: dotnet restore

      - name: 5. Compilar solucion en Release
        run: dotnet build --configuration Release --no-restore

      - name: 6. Publicar API
        run: dotnet publish ApiTaller.api/ApiTaller.api.csproj --configuration Release --no-build --output ./publish-api

      - name: 7. Validar contenido publicado
        run: |
          echo "Contenido de publish-api:"
          ls -la ./publish-api

          echo "Validando que NO se suba codigo fuente:"
          if find ./publish-api -name "*.csproj" | grep .; then
            echo "ERROR: El publish contiene archivos .csproj"
            exit 1
          fi

          if find ./publish-api -name "Program.cs" | grep .; then
            echo "ERROR: El publish contiene Program.cs"
            exit 1
          fi

          if find ./publish-api -type d -name "Controllers" | grep .; then
            echo "ERROR: El publish contiene carpeta Controllers"
            exit 1
          fi

          echo "Validacion correcta: solo se subiran archivos publicados."

      - name: 8. Subir compilado a rama produccion-api
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: produccion-api
          folder: ./publish-api
          clean: true
          single-commit: true
