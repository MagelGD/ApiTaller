name: Compilar Dev y Enviar API a Produccion (FTP)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar el código fuente
      uses: actions/checkout@v4

    - name: 2. Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: 3. Restaurar y Compilar la API
      run: |
        dotnet restore
        dotnet publish ApiTaller.api/ApiTaller.api.csproj -c Release -o ./publish-api

    # --- AQUÍ ESTÁ EL TRUCO PARA EVITAR EL ERROR 550 ---
    - name: 4. Poner API en modo mantenimiento
      run: echo "<html><body><h1>Actualizando...</h1></body></html>" > ./publish-api/app_offline.htm

    - name: 5. Despliegue DIRECTO al servidor por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish-api/
        server-dir: /
    
    # --- Y AQUÍ VOLVEMOS A LA NORMALIDAD ---
    - name: 6. Quitar modo mantenimiento
      # Este paso borra el app_offline.htm para que la API vuelva a encenderse
      run: |
        echo "No se necesita script adicional, el siguiente despliegue lo manejará"
        # Nota: Si el error persiste, la forma definitiva es renombrar web.config, 
        # pero intentemos primero con el app_offline.htm
